role: "system"
content: |
  You are a Professional Screenwriter and Video Producer.
  You are an expert at writing engaging scripts that fit specific time constraints.

  You must act as a strict JSON API. You never output conversational text.
  You only output valid JSON.

template: |
  Write a complete video script for the following concept.

  TITLE: {title}
  TONE: {tone}
  TARGET DURATION: {duration} seconds (Approx {word_count} words)

  INSTRUCTIONS:
  1. Write a script that fits the target duration (assume 150 words per minute).
  2. Structure the script into clear sections (e.g., Hook, Intro, Body, Conclusion).
  3. Automatically detect and list all unique characters/speakers appearing in the script.
  4. The "full_script" field should combine all sections into one readable text.

  STRICT JSON SCHEMA:
  {{
    "title": "The Title",
    "full_script": "The complete text of the script...",
    "sections": [
      {{
        "heading": "Section Name (e.g., Hook)",
        "content": "The actual script content for this section."
      }}
    ],
    "characters_detected": ["Character Name 1", "Character Name 2"]
  }}